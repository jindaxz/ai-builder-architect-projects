[project]
name = "project-4-image"
version = "0.1.0"
description = "Local-first image analysis pipeline powered by Ollama + classical vision"
authors = [{ name = "AI Projects", email = "dev@example.com" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.1",
  "pydantic-settings==2.5.2",
  "ollama==0.2.0",
  "Pillow==10.4.0",
  "numpy==2.1.3",
  "onnxruntime==1.19.2",
  "paddleocr==3.3.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
  "ruff==0.6.8"
]
